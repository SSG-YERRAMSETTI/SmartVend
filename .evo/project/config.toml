# EVO project configuration
#
# Project-owned. EVO created this file once and will never overwrite it.
# This file is authoritative: EVO does not infer validation commands at run time.
#
# Generated by EVO 0.1.1 on 2026-08-12T02:19:56Z, then completed from the
# repository audit at commit 204a4bb46bc1969704f6ea0045a9527042385a89.

[project]
name = "SmartVend"
# development | staging | production
environment = "development"
profiles = ["base", "python", "react-typescript"]

[docs]
# Authoritative documentation for this project, relative to the repository root.
# Reviewers check these for drift when behavior or architecture changes.
#
# The active gameplan is listed first. EVO 0.1.1 has no first-class
# "active gameplan" concept, so this list plus .evo/project/context.md and
# .evo/project/state.md carry that pointer. See the EVO compatibility finding
# recorded in state.md.
authoritative = [
  "docs/gameplans/SMARTVEND_PLATFORM_ARCHITECTURE_AND_SEEDLIVE_MVP.md",
  "docs/architecture/SMARTVEND_CURRENT_STATE_AUDIT.md",
  "docs/architecture/SMARTVEND_TARGET_ARCHITECTURE.md",
  ".evo/project/context.md",
  ".evo/project/state.md",
  ".evo/project/decisions",
]

# Validation commands executed by `evo validate` and `evo checkpoint`.
#
# Every command below was executed and its result observed during the baseline
# audit on 2026-08-12. Nothing here is aspirational.
#
# Frontend commands require `npm ci` to have been run; node_modules is not
# committed. That is an environment precondition, not a project defect.

[[validation]]
name = "frontend-typecheck"
category = "type"
command = ["npx", "tsc", "--noEmit", "-p", "tsconfig.app.json"]
required = true
timeout_seconds = 600

[[validation]]
name = "frontend-build"
category = "build"
command = ["npm", "run", "build"]
required = true
timeout_seconds = 900

# Optional on purpose. This currently reports 140 errors and 11 warnings, all
# pre-existing debt dominated by @typescript-eslint/no-explicit-any. Marking it
# required today would block every checkpoint for reasons unrelated to the
# change under review. It is tracked as decision D5 in the active gameplan and
# should become required once the debt is cleared.
[[validation]]
name = "frontend-lint"
category = "lint"
command = ["npm", "run", "lint"]
required = false
timeout_seconds = 600

# Known validation gaps, recorded rather than faked. See state.md.
#
# backend-tests      no test files exist anywhere on main
# backend-import     backend cannot import: sqlalchemy, alembic, passlib and jwt
#                    are not installed, and no virtualenv is committed
# backend-lint       no linter or type checker is configured for Python
# migration-check    Alembic is declared in requirements.txt but never
#                    initialized; there is nothing to check
# e2e                no browser tooling is configured
#
# None of these are configured above, because EVO must not report a check as
# passing that never ran, and must not claim a check exists when it does not.

