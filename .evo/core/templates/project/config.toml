# EVO project configuration
#
# Project-owned. EVO created this file once and will never overwrite it.
# This file is authoritative: EVO does not infer validation commands at run time.
#
# Generated by EVO {{EVO_VERSION}} on {{GENERATED_AT}}.

[project]
name = "{{PROJECT_NAME}}"
# development | staging | production
environment = "development"
profiles = [{{PROFILES}}]

[docs]
# Authoritative documentation for this project, relative to the repository root.
# Reviewers check these for drift when behavior or architecture changes.
authoritative = [
  ".evo/project/context.md",
  ".evo/project/state.md",
  ".evo/project/decisions",
]

# Validation commands executed by `evo validate` and `evo checkpoint`.
#
# Commands are argument arrays and are executed without a shell.
# `required = true` blocks a checkpoint on failure. `required = false` warns.
# `category` is free text; useful values: lint, type, unit, integration, build,
# contract, migration, security, ui, e2e.
#
# Nothing below is enabled until you uncomment it and confirm it is correct.
{{SUGGESTED_VALIDATIONS}}
# [[validation]]
# name = "unit-tests"
# category = "unit"
# command = ["python", "-m", "unittest", "discover", "-s", "tests"]
# required = true
# timeout_seconds = 900

# External systems this project integrates with. Names and roles only.
# Never record credentials, endpoints carrying secrets, or customer data here.
# [[external_system]]
# name = ""
# role = ""
# owner = ""

# Documented deviations from an Evolium standard.
# An undocumented deviation is a defect. Security requirements cannot be waived here.
# [[exception]]
# rule = ""
# reason = ""
# approved_by = ""
# date = ""

# Optional. Overrides the default patterns used to classify changed files in a
# checkpoint report. Patterns are fnmatch patterns against repository-relative
# paths with forward slashes.
# [checkpoint]
# architecture_paths = []
# security_paths = []
# documentation_paths = []
